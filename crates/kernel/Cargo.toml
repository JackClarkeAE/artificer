[package]
name = "artificer-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# Kernel stage timing (ADR 0056, Track R). Build a bench or a test with
# `--features perf-spans` and run with `ARTIFICER_PERF_REPORT=1` to see where
# an operation's time went; off, the stages compile to nothing.
perf-spans = ["artificer-compute/perf-spans"]

[dependencies]
artificer-compute = { path = "../compute" }
artificer-geometry = { path = "../geometry" }
artificer-protocol = { path = "../protocol" }
artificer-step = { path = "../step" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Statistics-driven timing only: the report generator and its plotting stack
# stay out of the tree, so a bench run adds a handful of crates rather than a
# hundred.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "extrude"
harness = false

[[bench]]
name = "booleans"
harness = false

[[bench]]
name = "blends"
harness = false

[[bench]]
name = "validate"
harness = false

[[bench]]
name = "tessellate"
harness = false

[lints]
workspace = true
