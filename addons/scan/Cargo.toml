# Standalone add-on workspace: deliberately not a member of the root
# workspace so scan tooling builds without touching the main tree's
# lockfile or target directory.
[workspace]
members = ["crates/scan-core", "apps/scan-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
