name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly, well clear of the working day: the bench job is long and its
    # only job is to catch catastrophes, not to gate a push.
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  deterministic-contract:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Repeat deterministic success and failure contracts
        run: |
          cargo run --quiet --package artificer-cli -- repeat tests/cases/m0-cuboid.json --count 100
          cargo run --quiet --package artificer-cli -- repeat tests/cases/m0-cuboid-zero-width.json --count 100

  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI build libraries
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          ripgrep
          libegl1-mesa-dev libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
          libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # The workbench suites are enumerated from the tree rather than from
        # memory: a newly added suite is in CI the moment it exists. Only the
        # pixel suites are held back, by the `*visual` naming convention, and
        # the focused-ui-pixels job below picks those up by the same rule.
        run: |
          cargo test --workspace --all-targets --exclude artificer-workbench
          suites=$(bash scripts/workbench-test-suites.sh logic)
          echo "workbench logic suites: $suites"
          cargo test --package artificer-workbench --lib --bin artificer-workbench $suites
      - name: Architecture boundaries
        run: bash scripts/check-architecture-boundaries.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      # Windows is a first-class target: the kernel is pure Rust and the
      # workbench is egui/wgpu, so the whole workspace is expected to build
      # here. Pixel snapshots are recorded on Linux and are not compared on
      # this runner; the kernel suites carry the exactness contracts and run
      # everywhere.
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Kernel and geometry tests
        run: cargo test --workspace --exclude artificer-workbench
      - name: Release executable
        run: cargo build --release --package artificer-workbench --bin artificer-workbench
      - uses: actions/upload-artifact@v4
        with:
          name: artificer-windows-x86_64
          path: target/release/artificer-workbench.exe
          if-no-files-found: error

  focused-ui-pixels:
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install headless graphics libraries
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libegl1-mesa-dev libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
          libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Verify focused UI snapshots
        # The document-properties baseline prints absolute paths from the
        # recording machine's home directory, so it cannot match here. Every
        # other snapshot is portable within the pixel threshold.
        run: |
          suites=$(bash scripts/workbench-test-suites.sh pixels)
          echo "workbench pixel suites: $suites"
          cargo test --package artificer-workbench $suites \
            -- --skip document_properties_units_and_interchange_snapshot

  release:
    # The releases page is the product's front door, and until now nothing
    # published to it: the Windows job uploads a run artifact, which expires
    # and lives behind the Actions tab. A tag now builds all three platforms
    # and attaches them to the release itself, named as the existing assets
    # are so the page stays consistent.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      # One failing platform must not withdraw the others from a release that
      # is already public.
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            archive: zip
          - os: ubuntu-24.04
            platform: linux-x86_64
            archive: tar
          - os: windows-latest
            platform: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI build libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libegl1-mesa-dev libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
          libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Release executable
        run: cargo build --release --package artificer-workbench --bin artificer-workbench
      - name: Package
        # Bash on every runner, Windows included, so there is one packaging
        # path to reason about rather than three.
        shell: bash
        run: |
          set -euo pipefail
          name="Artificer-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          binary="artificer-workbench"
          if [ "${{ runner.os }}" = "Windows" ]; then
            binary="artificer-workbench.exe"
          fi
          mkdir -p dist
          cp "target/release/$binary" dist/
          cp README.md LICENSE dist/ 2>/dev/null || cp README.md dist/
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a -tzip "../$name.zip" . >/dev/null || zip -r "../$name.zip" .)
            echo "asset=$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" -C dist .
            echo "asset=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Three jobs race to publish the same tag, so creating the release is
          # best-effort and uploading is idempotent.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "Artificer $GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.asset }}
          if-no-files-found: error

  nightly-benches:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      # Shared runners are noisy, so the gate is catastrophe-scale, not
      # noise-scale: the committed baselines are compared at 2x in
      # scripts/bench-gate.sh, and the raw numbers are always printed.
      - name: Kernel benches
        run: bash scripts/bench-gate.sh
