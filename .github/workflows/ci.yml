name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly, well clear of the working day: the bench job is long and its
    # only job is to catch catastrophes, not to gate a push.
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  deterministic-contract:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Repeat deterministic success and failure contracts
        run: |
          cargo run --quiet --package artificer-cli -- repeat tests/cases/m0-cuboid.json --count 100
          cargo run --quiet --package artificer-cli -- repeat tests/cases/m0-cuboid-zero-width.json --count 100

  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI build libraries
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          ripgrep
          libegl1-mesa-dev libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
          libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # The workbench suites are enumerated from the tree rather than from
        # memory: a newly added suite is in CI the moment it exists. Only the
        # pixel suites are held back, by the `*visual` naming convention, and
        # the focused-ui-pixels job below picks those up by the same rule.
        run: |
          cargo test --workspace --all-targets --exclude artificer-workbench
          suites=$(bash scripts/workbench-test-suites.sh logic)
          echo "workbench logic suites: $suites"
          cargo test --package artificer-workbench --lib --bin artificer-workbench $suites
      - name: Architecture boundaries
        run: bash scripts/check-architecture-boundaries.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      # Windows is a first-class target: the kernel is pure Rust and the
      # workbench is egui/wgpu, so the whole workspace is expected to build
      # here. Pixel snapshots are recorded on Linux and are not compared on
      # this runner; the kernel suites carry the exactness contracts and run
      # everywhere.
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Kernel and geometry tests
        run: cargo test --workspace --exclude artificer-workbench
      - name: Release executable
        run: cargo build --release --package artificer-workbench --bin artificer-workbench
      - uses: actions/upload-artifact@v4
        with:
          name: artificer-windows-x86_64
          path: target/release/artificer-workbench.exe
          if-no-files-found: error

  focused-ui-pixels:
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install headless graphics libraries
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libegl1-mesa-dev libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
          libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Verify focused UI snapshots
        # The document-properties baseline prints absolute paths from the
        # recording machine's home directory, so it cannot match here. Every
        # other snapshot is portable within the pixel threshold.
        run: |
          suites=$(bash scripts/workbench-test-suites.sh pixels)
          echo "workbench pixel suites: $suites"
          cargo test --package artificer-workbench $suites \
            -- --skip document_properties_units_and_interchange_snapshot

  release:
    # The releases page served Windows only, while the kernel and the
    # workbench build on all three. A tag now produces the same product
    # everywhere it is known to run.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: macos-15
            artifact: artificer-macos-arm64
          - os: ubuntu-24.04
            artifact: artificer-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI build libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libegl1-mesa-dev libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
          libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Release executable
        run: cargo build --release --package artificer-workbench --bin artificer-workbench
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/artificer-workbench dist/
          cp README.md dist/
          if [ "${{ runner.os }}" = "macOS" ]; then
            (cd dist && zip -r "../${{ matrix.artifact }}.zip" .)
          else
            tar -czf "${{ matrix.artifact }}.tar.gz" -C dist .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  nightly-benches:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      # Shared runners are noisy, so the gate is catastrophe-scale, not
      # noise-scale: the committed baselines are compared at 2x in
      # scripts/bench-gate.sh, and the raw numbers are always printed.
      - name: Kernel benches
        run: bash scripts/bench-gate.sh
