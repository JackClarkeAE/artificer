name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly, well clear of the working day: the bench job is long and its
    # only job is to catch catastrophes, not to gate a push.
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  deterministic-contract:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Repeat deterministic success and failure contracts
        run: |
          cargo run --quiet --package artificer-cli -- repeat tests/cases/m0-cuboid.json --count 100
          cargo run --quiet --package artificer-cli -- repeat tests/cases/m0-cuboid-zero-width.json --count 100

  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI build libraries
        # One script for every Ubuntu job: apt against a degraded mirror hangs
        # rather than fails, so it carries transfer timeouts and retries.
        run: bash scripts/install-linux-ui-libraries.sh ripgrep
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # The workbench suites are enumerated from the tree rather than from
        # memory: a newly added suite is in CI the moment it exists. Only the
        # pixel suites are held back, by the `*visual` naming convention, and
        # the focused-ui-pixels job below picks those up by the same rule.
        run: |
          cargo test --workspace --all-targets --exclude artificer-workbench
          suites=$(bash scripts/workbench-test-suites.sh logic)
          echo "workbench logic suites: $suites"
          cargo test --package artificer-workbench --lib --bin artificer-workbench $suites
      - name: Architecture boundaries
        run: bash scripts/check-architecture-boundaries.sh

  scan-addon:
    # `addons/scan` is a standalone workspace with its own lockfile, so no
    # root-workspace job compiles it. Without a job of its own it drifts
    # silently — it had already fallen a release behind on its path
    # dependency before this existed. It needs no UI libraries: the addon is
    # headless and depends only on `crates/geometry`.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: addons/scan
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: addons/scan
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: The lockfile must already be current
        # `cargo test` above would happily update the lockfile in place and
        # pass. Checking afterwards is what makes the drift visible.
        run: git diff --exit-code Cargo.lock

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      # Windows is a first-class target: the kernel is pure Rust and the
      # workbench is egui/wgpu, so the whole workspace is expected to build
      # here. Pixel snapshots are recorded on Linux and are not compared on
      # this runner; the kernel suites carry the exactness contracts and run
      # everywhere.
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Kernel and geometry tests
        run: cargo test --workspace --exclude artificer-workbench
      - name: Release executable
        run: cargo build --release --package artificer-workbench --bin artificer-workbench
      - uses: actions/upload-artifact@v4
        with:
          name: artificer-windows-x86_64
          path: target/release/artificer-workbench.exe
          if-no-files-found: error

  focused-ui-pixels:
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install headless graphics libraries
        run: bash scripts/install-linux-ui-libraries.sh
      - name: Verify focused UI snapshots
        # The document-properties baseline prints absolute paths from the
        # recording machine's home directory, so it cannot match here. Every
        # other snapshot is portable within the pixel threshold.
        run: |
          suites=$(bash scripts/workbench-test-suites.sh pixels)
          echo "workbench pixel suites: $suites"
          cargo test --package artificer-workbench $suites \
            -- --skip document_properties_units_and_interchange_snapshot

  release-prepare:
    # The release object is created once, up front, and as a draft. Three
    # packaging jobs used to race to create the same tag on their way to
    # uploading, which is how a release ends up half-populated in public while
    # the slowest runner is still linking. Now they only ever upload into a
    # release that already exists, and `release-publish` makes it visible after
    # every asset has landed.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag and the workspace version must agree
        # Velopack keys every install on the pack version, and a release whose
        # tag disagrees with the binary inside it cannot be reasoned about
        # afterwards. Cheap check, permanent class of bug removed.
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#v}"
          if [[ "$tagged" =~ ^[0-9]+\.[0-9]+$ ]]; then
            tagged="${tagged}.0"
          fi
          declared="$(awk '/^\[workspace\.package\]/ { found = 1 }
                          found && /^version = / { gsub(/[",]/, "", $3); print $3; exit }' Cargo.toml)"
          if [ "$tagged" != "$declared" ]; then
            printf 'error: tag %s does not match the workspace version %s\n' \
              "$GITHUB_REF_NAME" "$declared" >&2
            exit 1
          fi
      - name: Open the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes || true
          fi
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "Artificer $GITHUB_REF_NAME" --generate-notes

  release:
    needs: release-prepare
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      # One failing platform must not stop the others from being built; the
      # release stays a draft until they all land, so a partial failure is
      # visible to a maintainer rather than to users.
      fail-fast: false
      matrix:
        include:
          # Windows and Linux ship Velopack packages: an installer and an
          # AppImage that can update themselves from this same releases page.
          - os: windows-latest
            platform: windows-x86_64
            packaging: velopack
          - os: ubuntu-24.04
            platform: linux-x86_64
            packaging: velopack
          # macOS ships the unsigned `.app` bundle it always has. Velopack
          # requires notarisation there, and until the Apple Developer
          # certificates exist that build cannot update itself — About says so
          # rather than offering a button that would fail.
          - os: macos-15
            platform: macos-arm64
            packaging: bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI build libraries
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-ui-libraries.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2

      # --- Velopack packages (Windows, Linux) ------------------------------
      - uses: actions/setup-dotnet@v4
        if: matrix.packaging == 'velopack'
        with:
          dotnet-version: 8.0.x
      - name: Install the Velopack CLI
        if: matrix.packaging == 'velopack'
        shell: bash
        # Pinned to the `velopack` crate version the workbench links against:
        # the packaging tool and the runtime library are two halves of one
        # format, and they are only guaranteed to agree at the same version.
        run: dotnet tool install -g vpk --version 1.2.0
      - name: Fetch the previous release
        if: matrix.packaging == 'velopack'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/releases
          # Deltas are computed against the last full package, so it has to be
          # on disk before packing. The very first Velopack release has no
          # predecessor, and that is not a failure — it just ships whole.
          vpk download github \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --token "$GH_TOKEN" \
            --outputDir artifacts/releases \
            || echo "no previous Velopack release found; packing a full release"
          tagged="${GITHUB_REF_NAME#v}"
          if [[ "$tagged" =~ ^[0-9]+\.[0-9]+$ ]]; then
            tagged="${tagged}.0"
          fi
          rm -f artifacts/releases/*"$tagged"* artifacts/releases/*"${GITHUB_REF_NAME#v}"*
      - name: Pack
        if: matrix.packaging == 'velopack'
        shell: bash
        run: bash scripts/pack-release.sh "${GITHUB_REF_NAME#v}"
      - name: Upload the Velopack release
        if: matrix.packaging == 'velopack'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # `--merge` is what allows two platform jobs and the macOS bundle to
        # share one release; without it the second uploader refuses. The
        # channel defaults to the target OS, so `releases.win.json` and
        # `releases.linux.json` never collide.
        run: |
          set -euo pipefail
          vpk upload github \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --token "$GH_TOKEN" \
            --outputDir artifacts/releases \
            --tag "$GITHUB_REF_NAME" \
            --releaseName "Artificer $GITHUB_REF_NAME" \
            --merge
      - name: Attach a plain archive as well
        if: matrix.packaging == 'velopack'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # A migration aid for one release cycle. Everyone currently running
        # Artificer has a zip or a tarball, and nothing can upgrade them into
        # the installer automatically; they need one manual download, and it
        # should be the same shape as the asset they already have.
        run: |
          set -euo pipefail
          name="Artificer-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/artificer-workbench.exe dist/Artificer.exe
            cp README.md dist/
            (cd dist && 7z a -tzip "../$name.zip" . >/dev/null)
            asset="$name.zip"
          else
            cp target/release/artificer-workbench dist/Artificer
            cp README.md dist/
            tar -czf "$name.tar.gz" -C dist .
            asset="$name.tar.gz"
          fi
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          echo "asset=$asset" >> "$GITHUB_ENV"

      # --- macOS bundle ----------------------------------------------------
      - name: Build the macOS bundle
        if: matrix.packaging == 'bundle'
        shell: bash
        # The same script a developer runs locally, so the published bundle
        # cannot differ from the one that gets tested by hand. Until now this
        # job shipped the bare executable while the README promised an
        # `Artificer.app`.
        env:
          ARTIFICER_TARGET_DIR: target
        run: bash scripts/build-standalone.sh
      - name: Package and attach the macOS bundle
        if: matrix.packaging == 'bundle'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="Artificer-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          release_dir="artifacts/standalone/release"
          cp README.md "$release_dir/"
          (cd "$release_dir" && zip -qry "$GITHUB_WORKSPACE/$name.zip" Artificer.app README.md)
          gh release upload "$GITHUB_REF_NAME" "$name.zip" --clobber
          echo "asset=$name.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.asset }}
          if-no-files-found: error

  release-publish:
    # Every asset is attached, so the draft becomes the release. A failed
    # platform leaves it as a draft instead: an installer release that is
    # missing its feed file would leave update checks failing for everyone who
    # installed it, which is worse than a release that lands an hour late.
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "${{ github.repository }}" \
            --draft=false --latest

  nightly-benches:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      # Shared runners are noisy, so the gate is catastrophe-scale, not
      # noise-scale: the committed baselines are compared at 2x in
      # scripts/bench-gate.sh, and the raw numbers are always printed.
      - name: Kernel benches
        run: bash scripts/bench-gate.sh
